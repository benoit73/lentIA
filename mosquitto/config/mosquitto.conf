# Config Mosquitto pour le projet lentIA
# Listener MQTT classique (pour le Pico W, le client de test, l'API...)
# Le dashboard web ne parle plus directement au broker : il passe par les
# routes WebSocket de l'API (/ws/sensors/<capteur>), donc pas de listener
# websockets ici.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
